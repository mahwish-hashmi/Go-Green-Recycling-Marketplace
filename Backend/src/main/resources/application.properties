# --- 1. Security ---
jwt.secret=gogreen-secret-key-2024-secure

# --- 2. Database Connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Mahi@7861

# --- 3. Hibernate & Schema ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- 4. Data Initialization ---
# Runs data.sql once after Hibernate creates/updates tables
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# --- 5. Web ---
server.port=8080
server.servlet.context-path=/api

# --- 6. Misc ---
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


