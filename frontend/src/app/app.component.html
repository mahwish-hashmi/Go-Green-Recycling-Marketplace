<!-- app.component.html -->

<!-- ── Navbar (hidden on seller dashboard which has its own sidebar) ── -->
<nav class="navbar" [class.navbar--scrolled]="scrolled" *ngIf="!isSellerDashboard">
  <div class="navbar__inner">

    <!-- Brand -->
    <a routerLink="/shop" class="navbar__brand">
      <span class="navbar__brand-icon"><i class="fa-solid fa-leaf"></i></span>
      Go<strong>Green</strong>
    </a>

    <!-- Search -->
    <div class="navbar__search">
      <i class="fa-solid fa-magnifying-glass navbar__search-icon"></i>
      <input
        class="navbar__search-input"
        type="text"
        placeholder="Search eco products…"
        [(ngModel)]="searchTerm"
        (keyup.enter)="search()"
      />
      <button class="navbar__search-btn" (click)="search()">Search</button>
    </div>

    <!-- Nav links -->
    <ul class="navbar__links">
      <li>
        <a routerLink="/shop" routerLinkActive="navbar__link--active" class="navbar__link">
          <i class="fa-solid fa-store"></i> Shop
        </a>
      </li>

      <!-- Not logged in -->
      <ng-container *ngIf="!isLoggedIn">
        <li>
          <a routerLink="/register" routerLinkActive="navbar__link--active" class="navbar__link">
            Register
          </a>
        </li>
        <li>
          <a routerLink="/login" class="navbar__link navbar__link--cta">
            Sign in
          </a>
        </li>
      </ng-container>

      <!-- Logged in as BUYER -->
      <ng-container *ngIf="isLoggedIn && userRole === 'ROLE_BUYER'">
        <li>
          <a routerLink="/cart" routerLinkActive="navbar__link--active" class="navbar__link">
            <i class="fa-solid fa-basket-shopping"></i> Cart
          </a>
        </li>
        <li>
          <a routerLink="/account" routerLinkActive="navbar__link--active" class="navbar__link">
            <i class="fa-regular fa-user"></i>
            {{ username || 'Account' }}
          </a>
        </li>
      </ng-container>

      <!-- Logged in as SELLER -->
      <ng-container *ngIf="isLoggedIn && userRole === 'ROLE_SELLER'">
        <li>
          <a routerLink="/seller" routerLinkActive="navbar__link--active" class="navbar__link">
            <i class="fa-solid fa-grid-2"></i> Dashboard
          </a>
        </li>
        <li>
          <a routerLink="/account" routerLinkActive="navbar__link--active" class="navbar__link">
            <i class="fa-regular fa-user"></i>
            {{ username || 'Account' }}
          </a>
        </li>
      </ng-container>

      <!-- Logout (always shown when logged in) -->
      <li *ngIf="isLoggedIn">
        <button class="logout-btn" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Sign out
        </button>
      </li>
    </ul>

  </div>
</nav>

<!-- ── Page content ── -->
<div class="page-wrapper">
  <router-outlet></router-outlet>
</div>

<!-- ── Footer (hidden on seller dashboard) ── -->
<footer class="footer" *ngIf="!isSellerDashboard">
  <div class="footer__inner">
    <div class="footer__brand">
      <span class="footer__brand-icon"><i class="fa-solid fa-leaf"></i></span>
      GoGreen
    </div>
    <p class="footer__copy">© 2024 GoGreen · Sustainable marketplace for a better planet 🌍</p>
    <div class="footer__links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </div>
  </div>
</footer>
